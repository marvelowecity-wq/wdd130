<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Jinja White Water Rafting</title>
    <meta name="description" content="Contact Jinja White Water Rafting for booking and questions. Find us in Jinja Uganda.">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
<header>
    <img src="images/logo.png" alt="Jinja rafting logo">
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="trips.html">Trips</a>
        <a href="contact.html">Contact Us</a>
    </nav>
</header>

<main>
    <h1>Contact Jinja White Water Rafting</h1>

    <div class="contact-grid">
        <div class="company-info">
            <h2>Our Info</h2>
            <p>Address: Jinja Nile River, Uganda</p>
            <p>Phone: +256 700 123456</p>
            <p>Email: info@jinjarafting.ug</p>
            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3989.753!2d33.2!3d0.4!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMMKwMjQnMDAuMCJOIDMzwrAxMicwMC4wIkU!5e0!3m2!1sen!2sug!4v123456" width="300" height="200" allowfullscreen loading="lazy"></iframe>
            </div>
        </div>

        <div class="employees">
            <figure>
                <img src="images/profile.jpg" alt="Musumba Marvin">
                <figcaption>Musumba Marvin - Lead Guide</figcaption>
            </figure>
            <figure>
                <img src="images/sarah.jpg" alt="Sarah Nami">
                <figcaption>Sarah Nami - Reservation Manager</figcaption>
            </figure>
            <figure>
                <img src="images/john.jpg" alt="John Okello">
                <figcaption>John Okello - Safety Officer</figcaption>
            </figure>
        </div>
    </div>

    <!-- this form was broken in your photo, now fixed -->
    <section class="form-section">
        <h2>Send Us a Message</h2>
        <form>
            <label for="username">Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="useremail">Email:</label>
            <input type="email" id="useremail" name="useremail" required>

            <fieldset>
                <legend>Purpose of Message:</legend>
                <label><input type="radio" name="purpose" value="general" required> General Inquiry</label>
                <label><input type="radio" name="purpose" value="reservation"> Reservation Question</label>
                <label><input type="radio" name="purpose" value="website"> Website Suggestion</label>
            </fieldset>

            <label for="usermessage">Message:</label>
            <textarea id="usermessage" name="usermessage" rows="5" required></textarea>

            <label>
                <input type="checkbox" name="subscribe"> Please subscribe me to the monthly newsletter
            </label>

            <button type="submit">Send Message</button>
        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 Jinja White Water Rafting | Musumba Marvin</p>
    <nav class="sociallinks">
        <a href="https://facebook.com"><img src="images/facebook.svg" alt="facebook"></a>
        <a href="https://twitter.com"><img src="images/twitter.svg" alt="twitter"></a>
        <a href="https://instagram.com"><img src="images/instagram.svg" alt="instagram"></a>
    </nav>
</footer>
</body>
</html>
